[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-web-demo"
version = "2.1.0"
description = "A robust Flask web interface for MNIST digit recognition"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Flask>=3.1,<4",
    "numpy>=2.1,<2.4",
    "Pillow>=11,<13",
    "tensorflow>=2.20,<2.21",
    "keras>=3.12,<3.13",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "build>=1.3,<2",
]

[project.scripts]
mnist-web = "mnist_web.app:main"
mnist-train = "mnist_web.training:main"
mnist-evaluate = "mnist_web.evaluation:main"
mnist-release = "mnist_web.release:main"
mnist-benchmark = "mnist_web.benchmark:main"

[tool.setuptools]
py-modules = ["app", "model", "preprocessing"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mnist_web*"]

[tool.setuptools.package-data]
mnist_web = ["templates/*.html", "static/*.js", "static/*.css", "static/*.svg",
             "assets/*.keras", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
