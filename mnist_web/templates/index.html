<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在画布上书写数字并使用 MNIST 模型识别">
    <title>手写数字识别</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <header>
            <p class="eyebrow">MNIST · CNN</p>
            <h1>手写数字识别</h1>
            <p class="intro">在画布中写下一个 0–9 的数字，然后点击识别。</p>
        </header>

        <p class="intro"><a href="{{ url_for('collect') }}">采集带标签的评测样本</a></p>

        <canvas id="canvas" width="280" height="280" aria-label="手写数字画布"></canvas>

        <div class="actions">
            <button id="clear-button" class="secondary" type="button">清除</button>
            <button id="predict-button" type="button">识别</button>
        </div>

        <section class="result-panel" aria-live="polite" aria-atomic="true">
            <p id="status" class="status">等待输入</p>
            <div id="result" class="digit" aria-label="预测结果">—</div>
            <p id="confidence" class="confidence"></p>
            <p class="score-note">模型分数不代表正确率；请每次只写一个数字。</p>
            <ol id="top-results" class="top-results" aria-label="最可能的三个结果"></ol>
        </section>
    </main>

    <script src="{{ url_for('static', filename='drawing.js') }}" defer></script>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
