<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Draw a digit on the canvas and recognize it with an MNIST CNN">
    <title>Handwritten Digit Recognition</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <header>
            <p class="eyebrow">MNIST · CNN</p>
            <h1>Handwritten Digit Recognition</h1>
            <p class="intro">Draw a single digit from 0 to 9, then select Recognize.</p>
        </header>

        <p class="intro"><a href="{{ url_for('collect') }}">Collect labeled evaluation samples</a></p>

        <canvas id="canvas" width="280" height="280" aria-label="Handwritten digit canvas"></canvas>

        <div class="actions">
            <button id="clear-button" class="secondary" type="button">Clear</button>
            <button id="predict-button" type="button">Recognize</button>
        </div>

        <section class="result-panel" aria-live="polite" aria-atomic="true">
            <p id="status" class="status">Waiting for input</p>
            <div id="result" class="digit" aria-label="Prediction">—</div>
            <p id="confidence" class="confidence"></p>
            <p class="score-note">Model scores are not accuracy guarantees. Draw one digit at a time.</p>
            <ol id="top-results" class="top-results" aria-label="Top three predictions"></ol>
        </section>
    </main>

    <script src="{{ url_for('static', filename='drawing.js') }}" defer></script>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
