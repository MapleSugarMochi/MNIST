name: Model and wheel release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pytest
          python -m mnist_web.evaluation --output reports/release-evaluation.json
          python -m mnist_web.release --evaluation reports/release-evaluation.json
          python -m build --no-isolation
      - uses: actions/upload-artifact@v6
        with:
          name: mnist-release-bundle
          path: |
            dist/
            reports/release-evaluation.json
