name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Frontend behavior
        run: node --test tests/frontend.test.cjs
      - name: Build static browser demo
        run: |
          npm ci --prefix demo
          python scripts/build_site.py --output "${{ runner.temp }}/site"
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/mnist-wheel"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python="$RUNNER_TEMP/mnist-wheel/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/mnist-wheel/bin/python"
          fi
          "$wheel_python" -m pip install --no-deps --ignore-installed dist/*.whl
          cp scripts/check_installed.py "$RUNNER_TEMP/check_installed.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I check_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
