name: Deploy browser demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "mnist_web/static/**"
      - "mnist_web/assets/model.manifest.json"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test browser preprocessing parity
        run: node --test tests/frontend.test.cjs
      - name: Assemble site
        run: |
          npm ci --prefix demo
          python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
